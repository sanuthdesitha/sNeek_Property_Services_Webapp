# Add to the existing deployment: docker compose -f docker-compose.yml -f docker-compose.ollama.yml ...
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_NUM_PARALLEL: "1"
    # Accessible only on the compose network; do not publish the API publicly.
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./models:/models:ro
volumes:
  ollama_models:
